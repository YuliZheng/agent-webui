apply plugin: "com.android.application"

import java.util.Properties

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file("keystore.properties")
def hasReleaseSigning = signingPropertiesFile.exists()
if (hasReleaseSigning) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "com.lggram.tailnetrelay"
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.lggram.tailnetrelay"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 7
        versionName "1.5.1"
        testInstrumentationRunner "android.app.Instrumentation"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro",
            )
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lintOptions {
        abortOnError true
        checkReleaseBuilds true
        htmlReport true
        xmlReport true
    }
}

dependencies {
    testImplementation("junit:junit:4.13.2")
}
